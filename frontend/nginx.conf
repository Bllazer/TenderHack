server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
