services:
  api:
    build: ./backend
    environment:
      CATALOG_DIR: /srv/resources/catalog
      MODEL_DIR: /srv/resources/model
      CLEAN_SUPPLY_DIR: /srv/clean-supply
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MAX_PARALLEL_ANALYSES: "2"
    volumes:
      - ./backend/resources/catalog:/srv/resources/catalog:ro
      - ./backend/resources/model:/srv/resources/model:ro
      - ./ktru_clean:/srv/clean-supply:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
