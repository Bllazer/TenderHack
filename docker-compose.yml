services:
  api:
    init: true
    build: ./backend
    environment:
      CATALOG_DIR: /srv/resources/catalog-build
      MODEL_DIR: /srv/resources/model
      CLEAN_SUPPLY_DIR: /srv/clean-supply
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MAX_PARALLEL_ANALYSES: "2"
    volumes:
      - ${TENDERHACK_CATALOG_PATH:-./backend/resources/catalog-build}:/srv/resources/catalog-build:ro
      - ${TENDERHACK_MODEL_PATH:-./backend/resources/model}:/srv/resources/model:ro
      - ${TENDERHACK_CLEAN_SUPPLY_PATH:-./ktru_clean}:/srv/clean-supply:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
