services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenderhack
      POSTGRES_USER: tenderhack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderhack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderhack -d tenderhack"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tenderhack:${POSTGRES_PASSWORD:-tenderhack}@db:5432/tenderhack
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
